name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка или тег для деплоя staging (по умолчанию staging)"
        required: false
        default: "staging"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            DIR=/opt/deletemessagesbot-staging
            REF="${{ github.event.inputs.ref }}"

            if [ ! -d "$DIR/.git" ]; then
              echo "Папка $DIR ещё не создана."
              echo "Один раз на сервере:"
              echo "  cp -a /opt/deletemessagesbot $DIR"
              echo "  # или: git clone <url> $DIR"
              echo "  затем создай $DIR/.env.staging"
              exit 1
            fi

            cd "$DIR"
            git fetch origin
            git checkout "$REF"
            git pull origin "$REF"

            if [ ! -f .env.staging ]; then
              echo "Создай файл .env.staging (токен тестового бота) перед деплоем."
              exit 1
            fi

            mkdir -p data-staging
            docker compose -f docker-compose.staging.yml up -d --build
